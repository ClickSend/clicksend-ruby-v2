name: Ruby Gem

on:
  release:
    types: [published]      # publish when a GitHub Release is created
  workflow_dispatch:        # ...or trigger manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Test
        run: bundle exec rake spec

      - name: Build
        run: gem build *.gemspec

  # Public registry: RubyGems.org (https://rubygems.org/gems/clicksend_client)
  publish-rubygems:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write  # enable GitHub OIDC token issuance for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Push to RubyGems.org
        uses: rubygems/release-gem@v1

  # GitHub Packages: https://github.com/ClickSend/clicksend-ruby-v2/packages
  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Push to GitHub Packages
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:github: Bearer ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
          sudo chmod -R go-w /opt
          sudo chmod -R go-w /usr/share
          gem build *.gemspec
          gem push --KEY github --host https://rubygems.pkg.github.com/${OWNER} *.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.GPR_AUTH_TOKEN }}
          OWNER: ClickSend
